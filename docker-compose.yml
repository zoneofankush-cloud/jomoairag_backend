services:
  redis:
    image: redis:alpine
    container_name: rag_saas_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - bot_network

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: rag_saas_backend
    ports:
      - "8000:8000"
    volumes:
      # Inject Docker socket so sandbox tool can spawn containers dynamically
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist normal chat uploads
      - ./server_uploads:/app/app/uploads
      # Persist RAG specific uploads (even though they get deleted, it maps the folder)
      - ./server_rag_uploads:/app/uploads
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - bot_network
      - searxng_isolated_net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng_isolated
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./search/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    restart: unless-stopped
    networks:
      - searxng_isolated_net

networks:
  bot_network:
    driver: bridge
  searxng_isolated_net:
    name: searxng_isolated_net
    driver: bridge
