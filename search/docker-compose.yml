version: '3.7'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng_isolated
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    restart: unless-stopped
    networks:
      - searxng_isolated_net

networks:
  searxng_isolated_net:
    name: searxng_isolated_net
    driver: bridge
